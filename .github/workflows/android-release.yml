name: Android Release APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    name: Build and sign release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'

      - name: Verify signing secrets
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64"
          test -n "$RELEASE_STORE_PASSWORD"
          test -n "$RELEASE_KEY_ALIAS"
          test -n "$RELEASE_KEY_PASSWORD"

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Align and sign APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          unsigned_apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          test -f "$unsigned_apk"
          keystore="$RUNNER_TEMP/olauncher-release.jks"
          aligned_apk="$RUNNER_TEMP/olauncher-aligned.apk"
          mkdir -p artifacts
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          zipalign -f -p 4 "$unsigned_apk" "$aligned_apk"
          apksigner sign \
            --ks "$keystore" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_STORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out artifacts/olauncher-minimal-v6.11.5-release.apk \
            "$aligned_apk"
          apksigner verify --verbose --print-certs artifacts/olauncher-minimal-v6.11.5-release.apk
          rm -f "$keystore" "$aligned_apk"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: olauncher-minimal-v6.11.5-release
          path: artifacts/olauncher-minimal-v6.11.5-release.apk
          if-no-files-found: error
          retention-days: 30
